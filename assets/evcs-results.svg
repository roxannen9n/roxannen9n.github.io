<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">EV charging network expansion: reference results</title>
  <desc id="desc">63 proposed new stations serve 3,498 additional charging sessions per day and generate 119.77 million VND per day in incremental modeled network profit. Demand coverage increases from 37.8 percent to 58.0 percent.</desc>
  <rect width="1000" height="440" fill="#f8f7f3"/>
  <text x="48" y="51" fill="#38614e" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">EV CHARGING NETWORK EXPANSION</text>
  <text x="48" y="92" fill="#69716a" font-family="Arial, sans-serif" font-size="22">Ho Chi Minh City · Single-objective MILP</text>
  <path d="M352 137V280M668 137V280" stroke="#dcded6" stroke-width="2"/>
  <g fill="#38614e" font-family="Georgia, serif" font-size="78">
    <text x="48" y="216">63</text>
    <text x="390" y="216">3,498</text>
    <text x="706" y="216">119.77</text>
  </g>
  <g fill="#242c29" font-family="Arial, sans-serif" font-size="24">
    <text x="48" y="259">new stations selected</text>
    <text x="390" y="259">extra sessions / day</text>
    <text x="706" y="259">million VND / day</text>
  </g>
  <text x="706" y="290" fill="#69716a" font-family="Arial, sans-serif" font-size="20">incremental network profit</text>
  <rect x="48" y="329" width="904" height="62" rx="6" fill="#eaf0e6"/>
  <text x="70" y="369" fill="#38614e" font-family="Arial, sans-serif" font-size="25">Modeled demand coverage</text>
  <text x="930" y="369" text-anchor="end" fill="#38614e" font-family="Arial, sans-serif" font-size="29" font-weight="700">37.8% → 58.0%</text>
  <text x="48" y="421" fill="#69716a" font-family="Arial, sans-serif" font-size="17">Reference scenario · Proposed stations and modeled daily outcomes</text>
</svg>
